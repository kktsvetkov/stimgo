<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>" />
<title>Статистики за имената на гостите в епизодите на &quot;Свръхчовекът с Георги Ненов&quot;</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body class="font-monospace">
	<div class="container py-4">
		<header class="pb-3 mb-4">
			<nav class="navbar navbar-expand-lg bg-body-tertiary">
				<div class="container-fluid">
					<a class="navbar-brand" title="Стимго: статистика за имената на гостите">
						<i class="bi bi-bar-chart-line-fill d-inline-block" style="color: #0dcaf0;"></i>
						Стимго
					</a>

					<div class="collapse navbar-collapse">
						<ul id="control" class="navbar-nav justify-content-center"></ul>
					</div>
				</div>
			</nav>
		</header>

		<div id="chart"></div>

		<div class="offcanvas offcanvas-end"
			data-bs-scroll="true" tabindex="-1"
			id="preview" aria-labelledby="preview_label">

			<div class="offcanvas-header">
				<h5 class="offcanvas-title" id="preview_label">Епизоди</h5>
				<button type="button" class="btn-close"
					data-bs-dismiss="offcanvas" aria-label="Затвори"></button>
			</div>

			<div class="offcanvas-body" id="preview_contents">
				<p>Try scrolling the rest of the page to see this option in action.</p>
			</div>
		</div>

		<footer class="py-3 mt-4 text-body-secondary border-top">
			<div class="float-start">
				<small><strong class="text-secondary-emphasis">Стимго</strong>
					(<b>ст</b>атистики за <b>им</b>ената на <b>го</b>стите)
					версия <strong>1.1</strong>
				</small>
			</div>
			<div class="float-end">
				<small>статистиките са генерирани на база имената на гостите в
					<a href="https://thesuperhumanpodcast.net/"
						target="_blank">Свръхчовекът с Георги Ненов</a>
				</small>
			</div>
		</footer>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
		crossorigin="anonymous"></script>
	<script src="./index.js"></script>
	</body>
</html>
